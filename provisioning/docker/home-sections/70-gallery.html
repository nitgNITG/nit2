<!-- NIT default GALLERY (placeholder) — image grid, like nohahashim's ألبوم الصور.
     data-nit-section="gallery" + data-nit-gallery-grid let provisioning fill it with photos. -->
<div dir="auto" data-nit-section="gallery" style="background: var(--nit-brand-background); color: var(--nit-brand-textprimary); padding: 64px 20px;">
  <div style="max-width: 1140px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 36px;">
      <span style="display: inline-block; background: color-mix(in srgb, var(--nit-brand-accenttext) 15%, transparent); border: 1px solid color-mix(in srgb, var(--nit-brand-accenttext) 30%, transparent); border-radius: 50px; padding: 6px 18px; font-size: 14px; color: var(--nit-brand-accenttext); font-weight: bold;">{mlang ar}ألبوم الصور{mlang}{mlang en}Gallery{mlang}</span>
    </div>
    <div data-nit-gallery-grid style="display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px;">
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
      <div style="aspect-ratio:4/3; border-radius:12px; background: var(--nit-brand-surfacevariant); border:1px solid var(--nit-brand-borderprimary); display:flex; align-items:center; justify-content:center; color: var(--nit-brand-textsecondary); font-size:22px;">🖼️</div>
    </div>
  </div>
</div>
