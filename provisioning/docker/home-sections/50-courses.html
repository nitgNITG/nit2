<!-- NIT COURSES slider — live. theme_nit fills the cards from the academy's courses
     (window.NIT_COURSES) and wires the arrows. Colours follow Brand Colors. -->
<div dir="auto" style="background: var(--nit-brand-background); padding: 56px 16px;">
  <div style="max-width: 1200px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 36px; color: var(--nit-brand-textprimary);">
      <span style="display: inline-block; background: color-mix(in srgb, var(--nit-brand-accenttext) 15%, transparent); border: 1px solid color-mix(in srgb, var(--nit-brand-accenttext) 30%, transparent); border-radius: 50px; padding: 6px 18px; font-size: 14px; color: var(--nit-brand-accenttext); font-weight: bold;">{mlang ar}المناهج التعليمية{mlang}{mlang en}Courses{mlang}</span>
      <h2 style="font-size: clamp(24px,4vw,34px); font-weight: 800; margin: 14px 0 0;">{mlang ar}اختر مرحلتك وابدأ الآن{mlang}{mlang en}Choose your track and start now{mlang}</h2>
    </div>
    <div style="position: relative; padding: 0 28px;">
      <button style="position:absolute; inset-inline-start:-23px; top:50%; transform:translateY(-50%); z-index:20; width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid color-mix(in srgb,var(--nit-brand-accent) 50%,transparent); background:var(--nit-brand-surface); color:var(--nit-brand-accent); font-size:29px; font-weight:bold; cursor:pointer;" type="button" data-nit-scroll="prev">‹</button>
      <div style="display:flex; flex-direction:row; flex-wrap:nowrap; align-items:stretch; gap:20px; width:100%; overflow-x:auto; padding:8px 4px 20px; scroll-snap-type:x mandatory; scroll-behavior:smooth;" data-nit-courses="" data-limit="12" data-free-label="{mlang en}Free{mlang}{mlang ar}مجانًا{mlang}">
        <div style="display:none; flex:0 0 260px; width:260px; height:380px; scroll-snap-align:start;" data-nit-course-card="">
          <div style="width:100%; height:100%; box-sizing:border-box; background:var(--nit-brand-surface); border:1px solid color-mix(in srgb,var(--nit-brand-textprimary) 6%,transparent); border-radius:16px; overflow:hidden; display:flex; flex-direction:column;">
            <div style="position:relative; flex:0 0 150px; height:150px;">
              <div style="width:100%; height:150px; background:var(--nit-brand-surfacevariant) center/cover no-repeat;" data-nit-course-image=""> </div>
              <span style="position:absolute; top:12px; inset-inline-end:12px; background:var(--nit-brand-success); color:var(--nit-brand-textprimary); font-size:12px; font-weight:bold; padding:4px 12px; border-radius:50px;">{{price}}</span>
            </div>
            <div style="padding:16px; display:flex; flex-direction:column; flex:1; min-height:0;">
              <h3 style="font-size:16px; font-weight:bold; color:var(--nit-brand-textprimary); margin:0 0 4px; line-height:1.4;">{{fullname}}</h3>
              <div style="font-size:12px; color:var(--nit-brand-accenttext); margin:0 0 8px;">👤 {{teacher}}</div>
              <p style="font-size:13px; color:var(--nit-brand-textsecondary); line-height:1.6; margin:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">{{summary}}</p>
              <a class="nit-btn-solid" style="display:block; width:100%; box-sizing:border-box; margin-top:auto; text-align:center; background:var(--nit-brand-primary); color:var(--nit-brand-on-primary); font-weight:bold; padding:10px 12px; border-radius:8px; text-decoration:none;" href="{{url}}">{mlang ar}ابدأ الآن{mlang}{mlang en}Start now{mlang}</a>
            </div>
          </div>
        </div>
      </div>
      <button style="position:absolute; inset-inline-end:-23px; top:50%; transform:translateY(-50%); z-index:20; width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid color-mix(in srgb,var(--nit-brand-accent) 50%,transparent); background:var(--nit-brand-surface); color:var(--nit-brand-accent); font-size:29px; font-weight:bold; cursor:pointer;" type="button" data-nit-scroll="next">›</button>
    </div>
  </div>
</div>
