<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a16"/>
      <stop offset="100%" stop-color="#0f2e28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="100"  cy="100"  r="180" fill="#F59E0B" opacity="0.07"/>
  <circle cx="1100" cy="530"  r="220" fill="#F59E0B" opacity="0.07"/>
  <circle cx="600"  cy="315"  r="300" fill="#F59E0B" opacity="0.04"/>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="6" height="630" fill="#F59E0B" opacity="0.8"/>

  <!-- Icon group (centered at 600,290) -->
  <g transform="translate(600,290)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <polygon points="20,-90 -30,10 10,10 -20,90 40,-15 -5,-15 30,-90"
             fill="#00FFB2" opacity="0.9"/>
    <circle cx="0" cy="0" r="100" stroke="white" stroke-width="3" stroke-dasharray="12 10" opacity="0.3"/>
  </g>

  <!-- Bottom label strip -->
  <rect x="0" y="575" width="1200" height="55" fill="#F59E0B" opacity="0.12"/>
  <text x="60" y="608" font-family="Arial,sans-serif" font-size="20" font-weight="bold"
        fill="#F59E0B" opacity="0.9" letter-spacing="2">N.I.T EGYPT</text>
  <text x="1140" y="608" font-family="Arial,sans-serif" font-size="16"
        fill="white" opacity="0.5" text-anchor="end">Digital Transformation</text>
</svg>