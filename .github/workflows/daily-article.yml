name: Daily Article Publisher

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 09:00 Cairo (EET = UTC+2)
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Custom topic in Arabic (leave empty to use rotation)'
        required: false
        default: ''

jobs:
  publish-article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate & publish article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_JWT_SECRET:   ${{ secrets.SITE_JWT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_OVERRIDE:    ${{ github.event.inputs.topic_override }}
        run: node .github/scripts/publish-article.js
